name: ShotCart Event Scout

on:
  schedule:
    - cron: '0 13 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run event scout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python main.py

      - name: Commit updated dashboard
        run: |
          git config --global user.email "scout-bot@shotcart.app"
          git config --global user.name "ShotCart Scout Bot"
          git add index.html
          if git diff --staged --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git commit -m "Update dashboard $(date +'%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase origin main
            git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 3
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
